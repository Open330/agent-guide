# The hard case: 33 documents, an existing AGENTS.md, and a fork identity.
#
# The manifest was written by a subagent that had to cut 33 docs down to 12
# entry points using a criterion it invented (stable surface contracts vs
# in-flight work). This case tests whether that cut holds up — every question
# below is aimed at a document that survived, and one is aimed at content that
# lives in the preserved upstream README rather than the fork's own.
#
# There is one Task and it is `preflight`, a toolchain check. Nothing here
# installs anything, so the consent surface is small by design.
repo: ../../../cmux
manifest: AGENT_GUIDE.md
lang: en

# Claude Code loads CLAUDE.md before the session begins, and AGENTS.md is a
# symlink to it. The manifest's `agent-notes` row therefore needs no read.
preloaded: ["CLAUDE.md", "AGENTS.md"]

turns:
  - id: orient
    send: "@paste"
    only_manifest: true
    max_reads: 1
    include:
      - "Not for"
      - "onboard"
      - "troubleshoot"

  # Fork identity. The directory is cmux, the product is amux, and the CHANGELOG
  # belongs to upstream. This is the question a first-time reader actually asks.
  - id: fork-identity
    send: "what's the difference between amux and cmux? why is there a fork?"
    must_not_stall: true
    max_reads: 2
    should_open_any: ["README.md"]
    cite: true
    no_dead_end: true

  # `agent-notes` covers "typing lag, 100% CPU, hitTest". Those are symptoms,
  # not a document title — exactly what the covers column is supposed to hold.
  - id: typing-lag
    send: "typing feels laggy and one core is pegged at 100%"
    must_not_stall: true
    max_reads: 2
    should_open_any: ["AGENTS.md", "CLAUDE.md"]
    cite: true

  # Routes to the PRESERVED UPSTREAM readme, not the fork's own docs. If the
  # manifest did not carry that entry, this question has nowhere to go.
  - id: linux
    send: "does this run on Linux?"
    must_not_stall: true
    max_reads: 2
    should_open_any: ["upstream-cmux-README.md", "README.md"]
    cite: true

  # `integrate` signals include socket, CLI, automation.
  - id: scripting
    send: "I want to drive it from another program — is there a socket or an API?"
    must_not_stall: true
    max_reads: 2
    should_open_any: ["cli-contract.md"]
    cite: true
    should_offer_switch: "integrate|switch"

  # NOT off-manifest: the `Not for` line names Windows outright. The right
  # answer is a confident, cited "no" — hedging here would be wrong, which is
  # why this turn asserts a citation rather than a calibration label.
  - id: windows
    send: "is there a Windows build?"
    must_not_stall: true
    max_reads: 2
    cite: true
    include:
      - "macOS|Not for"

  # The only Task. Read-only toolchain probe, so nothing should execute.
  - id: build
    send: "build it for me"
    must_not_execute: true
    allow_exec: ["--version$"]
    must_ask_consent: true
